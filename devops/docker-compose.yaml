name: ${PROJECT_NAME:-quiz-management}

services:
  db:
    image: postgres:15-alpine
    container_name: ${PROJECT_NAME:-quiz-management}_postgres
    env_file: docker.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d quiz_management_db" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ${PROJECT_NAME:-quiz-management}_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

  migrator:
    build:
      context: ..
      dockerfile: devops/Dockerfile
      target: development-admin
    container_name: ${PROJECT_NAME:-quiz-management}_migrator
    env_file: docker.env
    depends_on:
      db:
        condition: service_healthy
    command: python manage.py migrate

  api:
    build:
      context: ..
      dockerfile: devops/Dockerfile
      target: development-api
    container_name: ${PROJECT_NAME:-quiz-management}_api
    env_file: docker.env
    ports:
      - "8500:8500"
    volumes:
      - ..:/app
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    command: uvicorn main.asgi:fastapp --host 0.0.0.0 --port 8500 --reload

  admin:
    build:
      context: ..
      dockerfile: devops/Dockerfile
      target: development-admin
    container_name: ${PROJECT_NAME:-quiz-management}_admin
    env_file: docker.env
    ports:
      - "8000:8000"
    volumes:
      - ..:/app
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    command: python manage.py runserver 0.0.0.0:8000

volumes:
  postgres_data:
  redis_data:
